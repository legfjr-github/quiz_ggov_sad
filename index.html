<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Inovação e Tecnologia na Gestão Pública</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --success: #10B981;
            --danger: #EF4444;
            --background: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --border: #E5E7EB;
            --tab-active: #4F46E5;
            --tab-inactive: #9CA3AF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f6f8fd 0%, #f1f5f9 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Navegação e Abas */
        .header-container {
            max-width: 800px;
            width: 100%;
            margin-bottom: 24px;
        }

        .tabs-container {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            background: #fff;
            padding: 10px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            background: transparent;
            color: var(--tab-inactive);
            font-weight: 600;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn:hover {
            background: var(--background);
            color: var(--text-main);
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.3);
        }

        .lessons-container {
            display: flex;
            gap: 12px;
            background: #fff;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            flex-wrap: wrap;
            justify-content: center;
        }

        .lesson-btn {
            padding: 10px 20px;
            border: 2px solid var(--border);
            background: #fff;
            color: var(--text-main);
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lesson-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .lesson-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        /* Container Principal do Quiz */
        .main-content {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .empty-state {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 60px 20px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            position: relative;
            display: none;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: var(--border);
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.4s ease;
        }

        .quiz-header {
            padding: 30px 30px 10px;
        }

        .question-counter {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .question-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.4;
            color: var(--text-main);
        }

        .question-text {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 24px;
            white-space: pre-wrap;
        }

        .quiz-body {
            padding: 0 30px 30px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #fff;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #f8faff;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-letter {
            font-weight: 700;
            margin-right: 12px;
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--background);
            border-radius: 50%;
            font-size: 0.875rem;
            flex-shrink: 0;
        }

        .option-btn.selected {
            border-color: var(--primary);
            background-color: #f8faff;
        }

        .option-btn.selected .option-letter {
            background-color: var(--primary);
            color: white;
        }

        .option-btn.correct {
            border-color: var(--success);
            background-color: #ecfdf5;
        }

        .option-btn.correct .option-letter {
            background-color: var(--success);
            color: white;
        }

        .option-btn.incorrect {
            border-color: var(--danger);
            background-color: #fef2f2;
        }

        .option-btn.incorrect .option-letter {
            background-color: var(--danger);
            color: white;
        }

        .feedback-area {
            margin-top: 24px;
            padding: 16px;
            border-radius: 12px;
            display: none;
            font-weight: 500;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback-area.success {
            display: block;
            background-color: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .feedback-area.error {
            display: block;
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .action-area {
            margin-top: 24px;
            display: none;
        }

        .next-btn, .restart-btn {
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.3);
        }

        .next-btn:hover, .restart-btn:hover {
            background-color: var(--primary-hover);
        }

        .result-container {
            text-align: center;
            padding: 40px 20px;
            display: none;
        }

        .trophy-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .score-text {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .score-percentage {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-weight: 500;
        }

        .score-message {
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 40px;
            line-height: 1.5;
        }

        #confetti {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }
            .quiz-header {
                padding: 24px 20px 10px;
            }
            .quiz-body {
                padding: 0 20px 24px;
            }
            .question-title {
                font-size: 1.15rem;
            }
            .option-btn {
                padding: 14px 16px;
            }
        }
    </style>
</head>

        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;
        let currentSet = '1-2';

        const emptyStateEl = document.getElementById('empty-state');
        const quizContainerEl = document.getElementById('quiz-container');
        const lessonsContainerEl = document.getElementById('lessons-container');
        const questionCounterEl = document.getElementById('question-counter');
        const questionTitleEl = document.getElementById('question-title');
        const questionTextEl = document.getElementById('question-text');
        const optionsListEl = document.getElementById('options-list');
        const feedbackAreaEl = document.getElementById('feedback-area');
        const actionAreaEl = document.getElementById('action-area');
        const nextBtnEl = document.getElementById('next-btn');
        const progressBarEl = document.getElementById('progress-bar');
        const quizContentEl = document.getElementById('quiz-content');
        const resultContainerEl = document.getElementById('result-container');
        const progressContainerEl = document.getElementById('progress-container');

        // Utils: shuffle array
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function selectModule(modNum) {
            // Update tabs UI
            document.getElementById('tab-mod1').classList.remove('active');
            document.getElementById('tab-mod2').classList.remove('active');
            document.getElementById(`tab-mod${modNum}`).classList.add('active');

            if (modNum === 1) {
                lessonsContainerEl.style.display = 'none';
                quizContainerEl.style.display = 'none';
                emptyStateEl.style.display = 'block';
            } else {
                emptyStateEl.style.display = 'none';
                lessonsContainerEl.style.display = 'flex';
                // Auto start first set
                startQuizSet('1-2');
            }
        }

        function startQuizSet(setName) {
            currentSet = setName;
            
            // Update buttons
            document.getElementById('btn-aula12').classList.remove('active');
            document.getElementById('btn-aula34').classList.remove('active');
            document.getElementById('btn-simulado').classList.remove('active');

            if (setName === '1-2') document.getElementById('btn-aula12').classList.add('active');
            if (setName === '3-4') document.getElementById('btn-aula34').classList.add('active');
            if (setName === 'simulado') document.getElementById('btn-simulado').classList.add('active');

            if (setName === '1-2') {
                currentQuestions = [...qsAulas1_2];
            } else if (setName === '3-4') {
                currentQuestions = [...qsAulas3_4];
            } else if (setName === 'simulado') {
                const rand12 = shuffleArray(qsAulas1_2).slice(0, 10);
                const rand34 = shuffleArray(qsAulas3_4).slice(0, 10);
                currentQuestions = shuffleArray([...rand12, ...rand34]);
            }

            quizContainerEl.style.display = 'block';
            currentQuestionIndex = 0;
            score = 0;
            quizContentEl.style.display = 'block';
            resultContainerEl.style.display = 'none';
            progressContainerEl.style.display = 'block';
            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            feedbackAreaEl.className = 'feedback-area';
            actionAreaEl.style.display = 'none';
            optionsListEl.innerHTML = '';
            
            const q = currentQuestions[currentQuestionIndex];
            
            const progress = (currentQuestionIndex / currentQuestions.length) * 100;
            progressBarEl.style.width = `${progress}%`;
            questionCounterEl.textContent = `Questão ${currentQuestionIndex + 1} de ${currentQuestions.length}`;
            
            questionTitleEl.textContent = q.title;
            questionTextEl.textContent = q.text;

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="option-letter">${opt.id}</span> <span>${opt.text}</span>`;
                btn.onclick = () => selectOption(opt, btn);
                optionsListEl.appendChild(btn);
            });
        }

        function selectOption(selectedOpt, btnElement) {
            if (answered) return;
            answered = true;

            const q = currentQuestions[currentQuestionIndex];
            const isCorrect = selectedOpt.id === q.answer;

            const allBtns = optionsListEl.querySelectorAll('.option-btn');
            allBtns.forEach(btn => {
                btn.disabled = true;
                const letterSpan = btn.querySelector('.option-letter').textContent;
                if (letterSpan === q.answer) {
                    btn.classList.add('correct');
                }
            });

            if (isCorrect) {
                btnElement.classList.add('correct');
                score++;
                feedbackAreaEl.textContent = "🎉 Correto! Muito bem.";
                feedbackAreaEl.className = 'feedback-area success';
            } else {
                btnElement.classList.add('incorrect');
                feedbackAreaEl.innerHTML = `❌ Incorreto. A resposta correta era <strong>${q.answer}</strong>.`;
                feedbackAreaEl.className = 'feedback-area error';
            }

            actionAreaEl.style.display = 'block';

            if (currentQuestionIndex === currentQuestions.length - 1) {
                nextBtnEl.textContent = 'Ver Resultado Final';
            } else {
                nextBtnEl.textContent = 'Próxima Questão';
            }
        }

        nextBtnEl.addEventListener('click', () => {
            if (currentQuestionIndex < currentQuestions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showResult();
            }
        });

        function showResult() {
            quizContentEl.style.display = 'none';
            progressContainerEl.style.display = 'none';
            resultContainerEl.style.display = 'block';

            const percentage = Math.round((score / currentQuestions.length) * 100);
            document.getElementById('score-text').textContent = `${score} / ${currentQuestions.length}`;
            document.getElementById('score-percentage').textContent = `${percentage}% de acertos`;

            const messageEl = document.getElementById('score-message');
            if (percentage >= 90) {
                messageEl.textContent = 'Excelente! Você domina muito bem o assunto.';
                triggerConfetti();
            } else if (percentage >= 70) {
                messageEl.textContent = 'Muito bom! Seu desempenho foi sólido.';
                triggerConfetti();
            } else if (percentage >= 50) {
                messageEl.textContent = 'Bom trabalho! Mas ainda há espaço para revisar alguns conceitos.';
            } else {
                messageEl.textContent = 'Parece que você precisa revisar o material. Continue estudando!';
            }
        }

        function triggerConfetti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#4F46E5', '#10B981', '#F59E0B'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#4F46E5', '#10B981', '#F59E0B'] });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());
        }

        // Inicia no Módulo 2 por padrão, nas Aulas 1-2
        selectModule(2);
    </script>
