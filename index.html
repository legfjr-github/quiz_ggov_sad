<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz: Inovação e Tecnologia na Gestão Pública</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --success: #10B981;
            --danger: #EF4444;
            --background: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --border: #E5E7EB;
            --tab-active: #4F46E5;
            --tab-inactive: #9CA3AF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f6f8fd 0%, #f1f5f9 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Navegação e Abas */
        .header-container {
            max-width: 800px;
            width: 100%;
            margin-bottom: 24px;
        }

        .tabs-container {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            background: #fff;
            padding: 10px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            background: transparent;
            color: var(--tab-inactive);
            font-weight: 600;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn:hover {
            background: var(--background);
            color: var(--text-main);
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.3);
        }

        .lessons-container {
            display: flex;
            gap: 12px;
            background: #fff;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            flex-wrap: wrap;
            justify-content: center;
        }

        .lesson-btn {
            padding: 10px 20px;
            border: 2px solid var(--border);
            background: #fff;
            color: var(--text-main);
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lesson-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .lesson-btn.active {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        /* Container Principal do Quiz */
        .main-content {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .empty-state {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 60px 20px;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            position: relative;
            display: none;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background-color: var(--border);
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary);
            width: 0%;
            transition: width 0.4s ease;
        }

        .quiz-header {
            padding: 30px 30px 10px;
        }

        .question-counter {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .question-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.4;
            color: var(--text-main);
        }

        .question-text {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 24px;
            white-space: pre-wrap;
        }

        .quiz-body {
            padding: 0 30px 30px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background-color: #fff;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 16px 20px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #f8faff;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-letter {
            font-weight: 700;
            margin-right: 12px;
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--background);
            border-radius: 50%;
            font-size: 0.875rem;
            flex-shrink: 0;
        }

        .option-btn.selected {
            border-color: var(--primary);
            background-color: #f8faff;
        }

        .option-btn.selected .option-letter {
            background-color: var(--primary);
            color: white;
        }

        .option-btn.correct {
            border-color: var(--success);
            background-color: #ecfdf5;
        }

        .option-btn.correct .option-letter {
            background-color: var(--success);
            color: white;
        }

        .option-btn.incorrect {
            border-color: var(--danger);
            background-color: #fef2f2;
        }

        .option-btn.incorrect .option-letter {
            background-color: var(--danger);
            color: white;
        }

        .feedback-area {
            margin-top: 24px;
            padding: 16px;
            border-radius: 12px;
            display: none;
            font-weight: 500;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feedback-area.success {
            display: block;
            background-color: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .feedback-area.error {
            display: block;
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .action-area {
            margin-top: 24px;
            display: none;
        }

        .next-btn,
        .restart-btn {
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.3);
        }

        .next-btn:hover,
        .restart-btn:hover {
            background-color: var(--primary-hover);
        }

        .skip-btn {
            width: 100%;
            padding: 16px;
            background-color: transparent;
            color: var(--text-muted);
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .skip-btn:hover {
            background-color: var(--background);
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        .result-container {
            text-align: center;
            padding: 40px 20px;
            display: none;
        }

        .trophy-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .score-text {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .score-percentage {
            font-size: 1.5rem;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-weight: 500;
        }

        .score-message {
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 40px;
            line-height: 1.5;
        }

        #confetti {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Seletor de Modo (Normal / Hard) */
        .mode-container {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            background: #fff;
            padding: 8px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .mode-btn {
            flex: 1;
            padding: 12px 20px;
            border: 2px solid transparent;
            background: transparent;
            color: var(--tab-inactive);
            font-weight: 700;
            font-size: 1rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .mode-btn:hover {
            background: var(--background);
            color: var(--text-main);
        }

        .mode-btn.active.normal {
            background: #EEF2FF;
            color: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.15);
        }

        .mode-btn.active.hard {
            background: #FEF2F2;
            color: var(--danger);
            border-color: var(--danger);
            box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.15);
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            .quiz-header {
                padding: 24px 20px 10px;
            }

            .quiz-body {
                padding: 0 20px 24px;
            }

            .question-title {
                font-size: 1.15rem;
            }

            .option-btn {
                padding: 14px 16px;
            }
        }
    </style>
</head>

<body>

    <div class="header-container">
        <div class="mode-container" id="mode-container">
            <button class="mode-btn normal active" id="btn-mode-normal" onclick="setMode('normal')">
                <span class="mode-icon">🎯</span> Modo Normal
            </button>
            <button class="mode-btn hard" id="btn-mode-hard" onclick="setMode('hard')">
                <span class="mode-icon">🔥</span> Modo Hard
            </button>
        </div>

        <div class="tabs-container" id="tabs-container">
            <!-- <button class="tab-btn" id="tab-mod1" onclick="selectModule(1)">Módulo 1</button> -->
            <button class="tab-btn active" id="tab-mod2" onclick="selectModule(2)">Módulo 2</button>
            <button class="tab-btn" id="tab-mod3" onclick="selectModule(3)">Módulo 3</button>
            <button class="tab-btn" id="tab-mod4" onclick="selectModule(4)">Módulo 4</button>
        </div>

        <div class="lessons-container" id="lessons-container">
            <button class="lesson-btn active" id="btn-aula12" onclick="startQuizSet('1-2')">Aulas 1-2</button>
            <button class="lesson-btn" id="btn-aula34" onclick="startQuizSet('3-4')">Aulas 3-4</button>
            <button class="lesson-btn" id="btn-simulado" onclick="startQuizSet('simulado')">Simulado (1-4)</button>
        </div>
    </div>

    <div class="main-content">
        <div class="empty-state" id="empty-state" style="display: none;">
            <h2>Módulo em branco</h2>
            <p style="color: var(--text-muted); margin-top: 10px;">Ainda não há questões disponíveis para este módulo.
            </p>
        </div>

        <div class="quiz-container" id="quiz-container">
            <canvas id="confetti"></canvas>
            <div class="progress-bar-container" id="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <div id="quiz-content">
                <div class="quiz-header">
                    <div class="question-counter" id="question-counter">Questão 1 de 20</div>
                    <h2 class="question-title" id="question-title">Carregando...</h2>
                    <p class="question-text" id="question-text"></p>
                </div>

                <div class="quiz-body">
                    <div class="options-list" id="options-list">
                    </div>
                    <div class="feedback-area" id="feedback-area"></div>
                    <div class="action-area" id="action-area">
                        <button class="skip-btn" id="skip-btn" onclick="skipQuestion()">Pular Questão</button>
                        <button class="next-btn" id="next-btn">Próxima Questão</button>
                    </div>
                </div>
            </div>

            <div class="result-container" id="result-container">
                <div class="trophy-icon">🏆</div>
                <div class="score-text" id="score-text">18/20</div>
                <div class="score-percentage" id="score-percentage">90%</div>
                <div class="score-message" id="score-message">Excelente trabalho!</div>
                <button class="restart-btn" onclick="startQuizSet(currentSet)">Tentar Novamente</button>
            </div>
        </div>
    </div>

    <!-- Script Confetti leve -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script id="quiz-questions-loader">
        const quizMode = localStorage.getItem('quiz_mode') || 'normal';
        const scriptSrc = quizMode === 'hard' ? 'questoes_hard.js' : 'questoes.js';
        document.write('<script src="' + scriptSrc + '"><\/script>');
    </script>
    <script>
        const currentQuizMode = localStorage.getItem('quiz_mode') || 'normal';

        function setMode(mode) {
            if (localStorage.getItem('quiz_mode') !== mode) {
                localStorage.setItem('quiz_mode', mode);
                window.location.reload();
            }
        }

        const modulesConfig = {
            1: [],
            2: [
                { id: '1-2', label: 'Aulas 1-2', data: qsMod2Aulas1_2 },
                { id: '3-4', label: 'Aulas 3-4', data: qsMod2Aulas3_4 }
            ],
            3: [
                { id: '1', label: 'Aulas 1', data: qsMod3Aula1 },
                { id: '2', label: 'Aulas 2', data: qsMod3Aula2 },
                { id: '3-4', label: 'Aulas 3-4', data: qsMod3Aulas3_4 }
            ],
            4: [
                { id: '1', label: 'Aulas 1', data: qsMod4Aula1 },
                { id: '2', label: 'Aulas 2', data: qsMod4Aula2 },
                { id: '3-4', label: 'Aulas 3-4', data: qsMod4Aulas3_4 }
            ]
        };

        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let answeredQuestionsCount = 0;
        let answered = false;
        let currentModule = 2;
        let currentSet = '1-2';

        const emptyStateEl = document.getElementById('empty-state');
        const quizContainerEl = document.getElementById('quiz-container');
        const lessonsContainerEl = document.getElementById('lessons-container');
        const questionCounterEl = document.getElementById('question-counter');
        const questionTitleEl = document.getElementById('question-title');
        const questionTextEl = document.getElementById('question-text');
        const optionsListEl = document.getElementById('options-list');
        const feedbackAreaEl = document.getElementById('feedback-area');
        const actionAreaEl = document.getElementById('action-area');
        const skipBtnEl = document.getElementById('skip-btn');
        const nextBtnEl = document.getElementById('next-btn');
        const progressBarEl = document.getElementById('progress-bar');
        const quizContentEl = document.getElementById('quiz-content');
        const resultContainerEl = document.getElementById('result-container');
        const progressContainerEl = document.getElementById('progress-container');

        // Utils: shuffle array
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Dynamically get lessons including simulation if applicable
        function getLessonsForModule(modNum) {
            let lessons = modulesConfig[modNum] ? [...modulesConfig[modNum]] : [];
            // Filter out any hardcoded simulado to avoid duplication
            lessons = lessons.filter(l => l.id !== 'simulado');
            if (lessons.length > 0) {
                lessons.push({ id: 'simulado', label: 'Simulado (Geral)', data: 'simulado' });
            }
            return lessons;
        }

        function selectModule(modNum) {
            currentModule = modNum;

            // Update tabs UI
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const tabEl = document.getElementById(`tab-mod${modNum}`);
            if (tabEl) tabEl.classList.add('active');

            const lessons = getLessonsForModule(modNum);

            if (!lessons || lessons.length === 0) {
                lessonsContainerEl.style.display = 'none';
                quizContainerEl.style.display = 'none';
                emptyStateEl.style.display = 'block';
            } else {
                emptyStateEl.style.display = 'none';
                lessonsContainerEl.style.display = 'flex';

                // Render lesson buttons
                lessonsContainerEl.innerHTML = '';
                lessons.forEach(lesson => {
                    const btn = document.createElement('button');
                    btn.className = 'lesson-btn';
                    btn.id = `btn-aula-${lesson.id}`;
                    btn.textContent = lesson.label;
                    btn.onclick = () => startQuizSet(lesson.id);
                    lessonsContainerEl.appendChild(btn);
                });

                // Auto start first set
                startQuizSet(lessons[0].id);
            }
        }

        function startQuizSet(setId) {
            currentSet = setId;

            // Update buttons
            document.querySelectorAll('.lesson-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`btn-aula-${setId}`);
            if (activeBtn) activeBtn.classList.add('active');

            const lessons = getLessonsForModule(currentModule);
            const lesson = lessons.find(l => l.id === setId);

            if (!lesson) return;

            if (lesson.data === 'simulado') {
                // Collect all non-simulado data from the current module
                let allRandoms = [];
                lessons.forEach(l => {
                    if (l.id !== 'simulado' && l.data && l.data.length > 0) {
                        // 5 questions if no hyphen (e.g. '1', '2'), 10 questions if hyphen (e.g. '1-2', '3-4')
                        const count = l.id.includes('-') ? 10 : 5;
                        allRandoms.push(...shuffleArray(l.data).slice(0, count));
                    }
                });
                currentQuestions = shuffleArray(allRandoms);
            } else {
                currentQuestions = [...lesson.data];
            }

            if (currentQuestions.length === 0) {
                quizContainerEl.style.display = 'none';
                emptyStateEl.style.display = 'block';
                return;
            } else {
                emptyStateEl.style.display = 'none';
                quizContainerEl.style.display = 'block';
            }

            currentQuestionIndex = 0;
            score = 0;
            answeredQuestionsCount = 0;
            quizContentEl.style.display = 'block';
            resultContainerEl.style.display = 'none';
            progressContainerEl.style.display = 'block';
            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            feedbackAreaEl.className = 'feedback-area';
            actionAreaEl.style.display = 'block';
            skipBtnEl.style.display = 'block';
            nextBtnEl.style.display = 'none';
            optionsListEl.innerHTML = '';

            const q = currentQuestions[currentQuestionIndex];

            const progress = (currentQuestionIndex / currentQuestions.length) * 100;
            progressBarEl.style.width = `${progress}%`;
            questionCounterEl.textContent = `Questão ${currentQuestionIndex + 1} de ${currentQuestions.length}`;

            questionTitleEl.textContent = q.title;
            questionTextEl.textContent = q.text;

            q.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="option-letter">${opt.id}</span> <span>${opt.text}</span>`;
                btn.onclick = () => selectOption(opt, btn);
                optionsListEl.appendChild(btn);
            });
        }

        function selectOption(selectedOpt, btnElement) {
            if (answered) return;
            answered = true;
            answeredQuestionsCount++;

            const q = currentQuestions[currentQuestionIndex];
            const isCorrect = selectedOpt.id === q.answer;

            const allBtns = optionsListEl.querySelectorAll('.option-btn');
            allBtns.forEach(btn => {
                btn.disabled = true;
                const letterSpan = btn.querySelector('.option-letter').textContent;
                if (letterSpan === q.answer) {
                    btn.classList.add('correct');
                }
            });

            if (isCorrect) {
                btnElement.classList.add('correct');
                score++;

                // Verifica se a explicação existe. Se sim, formata o texto; se não, fica vazio.
                const explanationText = q.explanation ? `<br><small>${q.explanation}</small>` : '';

                feedbackAreaEl.innerHTML = `🎉 Correto! Muito bem. ${explanationText}`;
                feedbackAreaEl.className = 'feedback-area success';
            } else {
                btnElement.classList.add('incorrect');

                // Mesma verificação para o caso de erro
                const explanationText = q.explanation ? `<br><small>${q.explanation}</small>` : '';

                feedbackAreaEl.innerHTML = `❌ Incorreto. A resposta correta era <strong>${q.answer}</strong>. ${explanationText}`;
                feedbackAreaEl.className = 'feedback-area error';
            }

            skipBtnEl.style.display = 'none';
            nextBtnEl.style.display = 'block';

            if (currentQuestionIndex === currentQuestions.length - 1) {
                nextBtnEl.textContent = 'Ver Resultado Final';
            } else {
                nextBtnEl.textContent = 'Próxima Questão';
            }
        }

        function skipQuestion() {
            if (currentQuestionIndex < currentQuestions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showResult();
            }
        }

        nextBtnEl.addEventListener('click', () => {
            if (currentQuestionIndex < currentQuestions.length - 1) {
                currentQuestionIndex++;
                loadQuestion();
            } else {
                showResult();
            }
        });

        function showResult() {
            quizContentEl.style.display = 'none';
            progressContainerEl.style.display = 'none';
            resultContainerEl.style.display = 'block';

            const totalForScore = answeredQuestionsCount;
            const percentage = totalForScore > 0 ? Math.round((score / totalForScore) * 100) : 0;
            document.getElementById('score-text').textContent = `${score} / ${totalForScore}`;
            document.getElementById('score-percentage').textContent = `${percentage}% de acertos`;

            const messageEl = document.getElementById('score-message');
            if (totalForScore === 0) {
                messageEl.textContent = 'Você não respondeu nenhuma questão. Tente responder a algumas questões para testar seu conhecimento!';
            } else if (percentage >= 90) {
                messageEl.textContent = 'Excelente! Você domina muito bem o assunto.';
                triggerConfetti();
            } else if (percentage >= 70) {
                messageEl.textContent = 'Muito bom! Seu desempenho foi sólido.';
                triggerConfetti();
            } else if (percentage >= 50) {
                messageEl.textContent = 'Bom trabalho! Mas ainda há espaço para revisar alguns conceitos.';
            } else {
                messageEl.textContent = 'Parece que você precisa revisar o material. Continue estudando!';
            }
        }

        function triggerConfetti() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#4F46E5', '#10B981', '#F59E0B'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#4F46E5', '#10B981', '#F59E0B'] });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());
        }

        // Update mode buttons state
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        if (currentQuizMode === 'hard') {
            const btnHard = document.getElementById('btn-mode-hard');
            if (btnHard) btnHard.classList.add('active');
        } else {
            const btnNormal = document.getElementById('btn-mode-normal');
            if (btnNormal) btnNormal.classList.add('active');
        }

        // Inicia no Módulo 3 por padrão, nas Aulas 1
        selectModule(3);
</script>
</body>

</html>
